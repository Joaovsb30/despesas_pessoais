name: expenses
description: Gestão de gastos pessoais, offline, com dados salvos no próprio celular.
publish_to: "none"

version: 2.2.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.0
  share_plus: ^13.3.1
  file_picker: ^13.3.3
  local_auth: ^3.0.2
  google_mlkit_text_recognition: ^0.17.1
  receive_sharing_intent: ^1.9.0
  image_picker: ^1.2.0
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
