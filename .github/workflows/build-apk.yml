name: Gerar APK

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["app_despesas/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_despesas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      # Algum plugin compila código nativo com CMake. Instalar antes, com novas
      # tentativas, evita falha quando o download automático vem corrompido.
      - name: Instalar CMake
        run: |
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null && exit 0
            echo "Tentativa $i falhou, tentando de novo..."
            rm -rf "$ANDROID_HOME/cmake/3.22.1"
            sleep 15
          done
          exit 1

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk despesas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: despesas-apk
          path: app_despesas/despesas.apk

      - name: Publicar release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app_despesas/despesas.apk
